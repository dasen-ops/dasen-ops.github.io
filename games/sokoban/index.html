<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f6ee">
  <title>推箱子 · Dyson的小小空间</title>
  <link rel="icon" href="../../assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../../assets/shared.css">
  <link rel="stylesheet" href="../../assets/site-nav.css">
  <link rel="stylesheet" href="styles.css">
  <script src="../../assets/site-core.js?v=20261004-modules" data-game="sokoban" defer></script>
  <script src="../../assets/site-nav.js" defer></script>
  <script src="../../assets/vendor/canvas-confetti/confetti.browser.js" defer></script>
  <script src="../../assets/celebrate.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body data-site-section="games">
  <main class="sokoban-page">
    <a class="back-link" href="../../index.html#games">← 返回首页</a>
    <header class="game-heading">
      <span class="eyebrow">慢慢想 · 走对每一步</span>
      <h1>推箱子</h1>
      <p>把每个箱子推到圆点上。箱子只能推，不能拉回来！</p>
    </header>
    <div class="level-bar">
      <label for="level-select">选关</label>
      <select id="level-select" aria-label="选择推箱子关卡"></select>
      <span id="completed-count">已完成 0 / 7</span>
    </div>
    <section class="play-panel" aria-label="推箱子游戏">
      <div class="score-strip">
        <span>走了 <strong id="moves">0</strong> 步</span>
        <span>推了 <strong id="pushes">0</strong> 次</span>
        <span>到位 <strong id="targets-filled">0 / 0</strong></span>
      </div>
      <p id="game-status" class="game-status" role="status" aria-live="polite">准备好了吗？先观察箱子和圆点的位置。</p>
      <div id="board" class="sokoban-board game-container" tabindex="0" role="group" aria-label="推箱子棋盘，使用方向键移动"></div>
      <div class="direction-pad" aria-label="移动方向">
        <button type="button" data-direction="left" aria-label="向左走">←</button>
        <button type="button" data-direction="up" aria-label="向上走">↑</button>
        <button type="button" data-direction="down" aria-label="向下走">↓</button>
        <button type="button" data-direction="right" aria-label="向右走">→</button>
      </div>
      <div class="game-actions">
        <button id="undo-button" type="button" class="btn" disabled>撤销一步</button>
        <button id="restart-button" type="button" class="btn">重玩这关</button>
        <button id="next-button" type="button" class="btn primary" disabled>下一关</button>
      </div>
      <p id="level-best" class="level-best">这关还没有完成，慢慢试就好。</p>
    </section>
    <p class="play-tip">电脑用方向键或 WASD；手机点方向按钮，也能在棋盘上滑动。Z 撤销，R 重玩。</p>
    <p id="save-note" class="save-note" hidden></p>
    <footer class="page-footer">改编自 Frank Force 的 <a href="https://github.com/KilledByAPixel/LittleJSArcade/blob/ea73cf7357854c913798390603045fdcb1f472e7/games/sokoban.html" target="_blank" rel="noopener noreferrer">LittleJS Sokoban</a> · <a href="LICENSE">MIT 开源许可</a></footer>
  </main>
</body>
</html>

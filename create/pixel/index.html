<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f6f6ee">
  <meta name="description" content="点亮小格子，画一张自己的像素画。支持手机涂画、撤销、PNG下载和存到本机相册。">
  <title>像素小画家 · Dyson的小小空间</title>
  <link rel="icon" href="../../assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../../assets/shared.css">
  <link rel="stylesheet" href="../../assets/site-nav.css">
  <link rel="stylesheet" href="pixel.css">
  <script src="../../assets/site-core.js?v=20261004-modules" defer></script>
  <script src="../../assets/site-nav.js" defer></script>
  <script src="../../draw/vendor/konva-10.7.0.min.js" defer></script>
  <script src="../../assets/artwork-store.js" defer></script>
  <script src="pixel.js" defer></script>
</head>
<body data-site-section="draw">
  <main class="page-shell pixel-page">
    <a class="back-link" href="../../index.html#creative">← 返回首页</a>
    <header class="page-head"><h1>🟩 像素小画家</h1><p>一格一格涂上颜色，把小点子画成自己的像素作品。</p></header>
    <div class="pixel-layout">
      <section class="panel pixel-canvas-panel" aria-label="像素画布">
        <div class="canvas-heading"><h2>我的小作品</h2><button id="toggle-grid" class="btn" type="button" aria-pressed="true">隐藏格线</button></div>
        <div id="pixel-canvas" class="pixel-canvas" role="img" aria-label="8行8列的像素画布，可用鼠标或手指涂画"></div>
        <p class="canvas-tip">选好颜色，再点格子或拖着画。格线只帮你看清位置，不会出现在保存的图片里。</p>
        <p id="pixel-status" class="pixel-status" role="status" aria-live="polite">准备好啦，从一个小格子开始。</p>
      </section>
      <aside class="panel pixel-tools" aria-label="颜色与画画工具">
        <div id="pixel-brush-tools" class="pixel-brush-tools">
          <h2>挑个颜色</h2>
          <div id="pixel-colors" class="pixel-colors" role="group" aria-label="画笔颜色"></div>
          <div class="tool-row" role="group" aria-label="画画工具"><button class="btn tool-button" type="button" data-tool="paint" aria-pressed="true">🖌 画笔</button><button class="btn tool-button" type="button" data-tool="erase" aria-pressed="false">⌫ 橡皮</button></div>
        </div>
        <div class="tool-row"><button id="pixel-undo" class="btn" type="button" disabled>↶ 撤销</button><button id="pixel-redo" class="btn" type="button" disabled>↷ 重做</button></div>
        <h2 class="tools-label">格子大小</h2>
        <div class="tool-row" role="group" aria-label="选择格子数"><button class="btn" type="button" data-size="8" aria-pressed="true">8 × 8 · 大格</button><button class="btn" type="button" data-size="16" aria-pressed="false">16 × 16 · 细格</button></div>
        <h2 class="tools-label">从一个小点子开始</h2>
        <div class="tool-row"><button class="btn" type="button" data-preset="heart">♡ 小爱心</button><button class="btn" type="button" data-preset="flower">✿ 小花朵</button></div>
        <div class="save-actions"><button id="pixel-download" class="btn primary" type="button">↓ 下载图片</button><button id="pixel-save-album" class="btn" type="button">收进小相册</button><a class="btn" href="../../album/index.html#my-artworks">去看我的画作 →</a></div>
        <button id="pixel-clear" class="clear-button" type="button">清空画布</button>
        <p id="pixel-draft" class="draft-note">这台设备会记住你画到哪里。</p>
      </aside>
    </div>
    <footer class="page-footer">画布由 <a href="https://github.com/konvajs/konva" target="_blank" rel="noopener">Konva</a> 提供。像素画和小图案由本站制作。<a href="SOURCE.md">制作与来源说明</a></footer>
    <noscript><p>请允许浏览器运行 JavaScript，就可以涂画小格子了。</p></noscript>
  </main>
</body>
</html>

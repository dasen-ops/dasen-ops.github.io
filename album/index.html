<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f6f6ee">
  <title>小相册 · Dyson的小小空间</title>
  <link rel="stylesheet" href="../assets/shared.css">
  <link rel="stylesheet" href="../assets/site-nav.css">
  <link rel="stylesheet" href="../assets/vendor/photoswipe/photoswipe.css">
  <link rel="stylesheet" href="album.css">
  <script src="../assets/site-core.js" defer></script>
  <script src="../assets/site-nav.js" defer></script>
</head>
<body data-site-section="album">
  <main class="page-shell">
    <a class="back-link" href="../index.html#album">← 返回首页</a>
    <header class="page-head"><h1>📷 小相册</h1><p>收好自己画的小世界，也看看游乐园里的精彩瞬间。点图片就能放大。</p></header>
    <section class="album-section" id="my-artworks" aria-labelledby="personal-title">
      <h2 id="personal-title">🎨 我的画作</h2>
      <p class="album-note">在画板点“存到相册”，作品就会来到这里。最多收好 12 张；喜欢的画也可以下载留存。</p>
      <div id="personal-empty" class="album-empty"><p>这里还没有你的画作。画一张喜欢的小世界吧！</p><a class="btn primary" href="../draw/index.html">去画画 →</a></div>
      <div id="personal-gallery" class="album-grid"></div>
      <p id="personal-status" role="status">正在打开本机相册……</p>
    </section>
    <section class="album-section" aria-labelledby="screenshots-title">
      <h2 id="screenshots-title">🎮 游乐园小瞬间</h2>
      <p class="album-note">这些是小游戏的实际画面。点一下放大，左右滑动看下一张。</p>
      <div class="album-grid" data-gallery>
        <figure><a href="images/snake.png" data-pswp-width="960" data-pswp-height="720"><img src="images/snake.png" width="960" height="720" alt="水果贪吃蛇游戏的绿色花园" loading="lazy"><figcaption>水果花园<small>我们的第一款小游戏，小蛇一路寻找水果。</small></figcaption></a></figure>
        <figure><a href="images/2048.png" data-pswp-width="960" data-pswp-height="720"><img src="images/2048.png" width="960" height="720" alt="2048 数字合合乐的游戏棋盘" loading="lazy"><figcaption>数字合合乐<small>从小小的 2 出发，慢慢拼出更大的数字。</small></figcaption></a></figure>
        <figure><a href="images/memory.png" data-pswp-width="960" data-pswp-height="720"><img src="images/memory.png" width="960" height="720" alt="记忆方格中亮起来的格子" loading="lazy"><figcaption>亮起来的方格<small>看清位置，把它们记在脑袋里。</small></figcaption></a></figure>
        <figure><a href="images/breakout.png" data-pswp-width="960" data-pswp-height="720"><img src="images/breakout.png" width="960" height="720" alt="打砖块游戏的彩色砖块和小球" loading="lazy"><figcaption>彩色砖块<small>小球弹来弹去，一块块砖消失啦！</small></figcaption></a></figure>
      </div>
    </section>
    <footer class="page-footer">画作和收藏保存在当前设备的浏览器中；清除浏览器数据会移除这些记录。重要作品请下载保存。相册浏览效果由 <a href="https://github.com/dimsemenov/PhotoSwipe" target="_blank" rel="noopener">PhotoSwipe</a> 提供。</footer>
  </main>
  <script src="../assets/vendor/photoswipe/photoswipe.umd.min.js"></script>
  <script src="../assets/vendor/photoswipe/photoswipe-lightbox.umd.min.js"></script>
  <script src="../assets/gallery.js"></script>
  <script src="../assets/artwork-store.js"></script>
  <script src="personal-gallery.js"></script>
</body>
</html>
